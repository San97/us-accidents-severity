stages:

  ingest:
    cmd: python src/data_ingestion.py
      --input data/raw/US_Accidents_March23.csv
      --output data/interim/ingested.csv
    deps:
      - src/data_ingestion.py
      - data/raw/US_Accidents_March23.csv
    outs:
      - data/interim/ingested.csv

  preprocess:
    cmd: python src/preprocessing.py
      --input data/interim/ingested.csv
      --output data/interim/preprocessed.csv
    deps:
      - src/preprocessing.py
      - data/interim/ingested.csv
    outs:
      - data/interim/preprocessed.csv

  feature_engineer:
    cmd: python src/feature_engineering.py
      --input data/interim/preprocessed.csv
      --output data/processed/features.csv
      --params params.yaml
    deps:
      - src/feature_engineering.py
      - data/interim/preprocessed.csv
    params:
      - feature_engineering
    outs:
      - data/processed/features.csv
